<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Situação do Aluno</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    input, button { padding: 10px; margin: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Situação do Aluno</h1>
  <label>Nota do Aluno: </label>
  <input type="number" step="0.1" id="nota" placeholder="Ex: 7.5">
  <br><br>
  <button onclick="verificarNota()">Verificar Situação</button>
  <p id="resultado"></p>

  <script>
    function verificarNota() {
      const nota = parseFloat(document.getElementById('nota').value);
      const res = document.getElementById('resultado');

      if (isNaN(nota)) {
        res.innerHTML = "Digite uma nota válida!";
        return;
      }

      if (nota >= 6) {
        res.innerHTML = "✅ <strong>Aprovado</strong>";
      } else if (nota >= 4 && nota <= 5.9) {
        res.innerHTML = "⚠️ <strong>Recuperação</strong>";
      } else {
        res.innerHTML = "❌ <strong>Reprovado</strong>";
      }
    }
  </script>
</body>
</html>
