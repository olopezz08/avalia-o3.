<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifica Velocidade</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
    input, button { padding: 10px; margin: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Programa Verifica Velocidade</h1>
  <label>Velocidade Permitida: </label>
  <input type="number" id="permitida" placeholder="Ex: 80"><br>
  <label>Velocidade do Condutor: </label>
  <input type="number" id="condutor" placeholder="Ex: 95"><br><br>
  <button onclick="verificarVelocidade()">Verificar Velocidade</button>
  <p id="resultado"></p>

  <script>
    function verificarVelocidade() {
      const permitida = parseFloat(document.getElementById('permitida').value);
      const condutor = parseFloat(document.getElementById('condutor').value);
      const res = document.getElementById('resultado');

      if (isNaN(permitida) || isNaN(condutor)) {
        res.innerHTML = "Digite valores válidos!";
        return;
      }

      if (condutor <= permitida) {
        res.innerHTML = "Situação: <strong>Sem Multa</strong>";
      } else {
        const limiteLeve = permitida * 1.20;
        if (condutor <= limiteLeve) {
          res.innerHTML = "Situação: <strong>Multa Leve</strong>";
        } else {
          res.innerHTML = "Situação: <strong>Multa Grave</strong>";
        }
      }
    }
  </script>
</body>
</html>
