<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Par ou Ímpar</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      text-align: center; 
      padding: 50px; 
      background-color: #f0f0f0;
    }
    input, button { 
      padding: 12px; 
      margin: 10px; 
      font-size: 18px; 
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #resultado {
      font-size: 22px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Programa Par ou Ímpar</h1>
  <label>Número: </label>
  <input type="number" id="num" placeholder="Digite um número">
  <br><br>
  <button onclick="verificarParImpar()">Verificar se é Par ou Ímpar</button>
  <p id="resultado"></p>

  <script>
    function verificarParImpar() {
      const num = parseInt(document.getElementById('num').value);
      const res = document.getElementById('resultado');
      
      if (isNaN(num)) {
        res.innerHTML = "❌ Por favor, digite um número válido!";
        return;
      }

      // Mensagens especiais
      if (num === 13) {
        res.innerHTML = `${num} é o <strong>número do capeta</strong> e é <strong>Ímpar</strong>! 👿`;
        return;
      }
      
      if (num === 22) {
        res.innerHTML = `${num} é <strong>de Deus</strong> e é <strong>Par</strong>! 🙏`;
        return;
      }
      
      // Comportamento normal
      if (num % 2 === 0) {
        res.innerHTML = `${num} é <strong>Par</strong>`;
      } else {
        res.innerHTML = `${num} é <strong>Ímpar</strong>`;
      }
    }
  </script>
</body>
</html>
